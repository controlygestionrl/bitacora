<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitácora de Terreno</title>
<meta name="theme-color" content="#0E4F52">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<style>
/* Layout: barra superior fija con estado de sincronización, pestañas por rol, columna central de formularios de 760px apta para una mano en el celular */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --sunk:#E3E8E5; --line:#CBD3CF; --ink:#16201C; --muted:#56635D;
  --primary:#0E4F52; --primary-ink:#FFFFFF; --hivis:#F2B705; --hivis-ink:#1E1A00;
  --ok:#1F7A3E; --warn:#A35F00; --bad:#B3261E; --okbg:#E1F1E6; --warnbg:#FBEED5; --badbg:#F9E1DE;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221F; --sunk:#0D1311; --line:#2E3A36; --ink:#E5ECE9; --muted:#9AA8A2;
  --primary:#5FB3B0; --primary-ink:#06201F; --hivis:#F2B705; --hivis-ink:#1E1A00;
  --ok:#6FCB8C; --warn:#F0B354; --bad:#F08A80; --okbg:#173022; --warnbg:#33260E; --badbg:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221F; --sunk:#0D1311; --line:#2E3A36; --ink:#E5ECE9; --muted:#9AA8A2;
  --primary:#5FB3B0; --primary-ink:#06201F; --hivis:#F2B705; --hivis-ink:#1E1A00;
  --ok:#6FCB8C; --warn:#F0B354; --bad:#F08A80; --okbg:#173022; --warnbg:#33260E; --badbg:#3A1A17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--primary)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--primary);color:var(--primary-ink)}
.top-in{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;background:var(--hivis);display:inline-block;transform:rotate(45deg)}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hivis)}
.dot.on{background:#7CE29B}.dot.off{background:#FF8A7A}
.tabs{max-width:960px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{all:unset;cursor:pointer;padding:9px 14px 10px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--primary-ink);opacity:.75;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--hivis)}
.tabs button:focus-visible{outline:2px solid var(--hivis);outline-offset:-2px}
main{max-width:800px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px;display:grid;gap:18px}
main.wide{max-width:960px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:19px}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label.f{display:grid;gap:5px;font-weight:600;font-size:14px;min-width:0}
label.f small{font-weight:400;color:var(--muted)}
.req::after{content:" *";color:var(--bad)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
input[readonly]{background:var(--sunk);font-family:var(--f-mono);font-weight:500}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:6px;font-weight:700;font-size:15px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);min-height:44px;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.hv{background:var(--hivis);color:var(--hivis-ink);border-color:var(--hivis)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:14px;padding:8px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);min-height:20px}
.chip[aria-pressed="true"]{background:var(--hivis);color:var(--hivis-ink);border-color:var(--hivis);font-weight:500}
.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.grp{display:grid;gap:8px}
.grp-t{font-size:13px;font-weight:700;color:var(--muted)}
.act{border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:var(--r);background:var(--bg);padding:14px;display:grid;gap:12px}
.act-h{display:flex;align-items:center;gap:10px}
.act-h h3{font-size:17px}
.act-h .row{margin-left:auto}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph{display:grid;gap:6px;font-weight:600;font-size:14px}
.ph .box{aspect-ratio:4/3;max-width:100%;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;background:var(--surface);overflow:hidden;color:var(--muted);font-weight:400;font-size:13px;text-align:center;padding:6px;cursor:pointer;position:relative}
.ph .box img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph input{display:none}
.note{font-size:14px;color:var(--muted)}
.banner{border-radius:var(--r);padding:12px 14px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.banner.ok{background:var(--okbg);color:var(--ok)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.list{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .m{display:grid;gap:2px;min-width:0;flex:1}
.li .m b{font-family:var(--f-display);font-size:16px}
.li .m span{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
tr:last-child td{border-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--bg)}
.kpi b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-size:15px}
.checks input{width:18px;height:18px}
.fld{display:grid;grid-template-columns:2fr 1.2fr 1fr auto;gap:8px;align-items:end;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.fld .x{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.mono{font-family:var(--f-mono);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:6px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.sticky-act{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;z-index:3}
.sticky-act .btn{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.rep h3{font-size:16px;margin-top:6px}
.rep-head{display:grid;gap:4px;border-bottom:3px solid var(--hivis);padding-bottom:10px}
.rep-head h2{font-size:22px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs img{width:120px;height:90px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
@media (max-width:560px){.fld{grid-template-columns:1fr 1fr}.photos{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><i></i>Bitácora de Terreno</div>
    <div class="sync" id="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Iniciando…</span></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="registro" aria-selected="true">Registrar</button>
    <button role="tab" data-v="envios" aria-selected="false">Mis envíos</button>
    <button role="tab" data-v="informe" aria-selected="false" hidden>Informe</button>
  </nav>
</header>
<main id="view"></main>
<p class="note" style="text-align:center;padding-bottom:28px"><button class="btn sm ghost" id="adminLink" type="button">Acceso administrador</button></p>
<div class="toast" id="toast" hidden></div>

<script>
// =====================================================================
//  PASO ÚNICO DE CONFIGURACIÓN: pega aquí la URL de tu Aplicación web
//  (la que termina en /exec). Ejemplo:
//  const API = "https://script.google.com/macros/s/AKfycb.../exec";
// =====================================================================
const API = "https://script.google.com/macros/s/AKfycbxpkoy3b2_FsFtHi2zugLO5mQam01TPFyIaEFa0Mf6zzuVlHUzpJboWRFgBmf1VSyC7_Q/exec";
</script>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const local=d=>{d=new Date(d);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString()};
const today=()=>local(new Date()).slice(0,10);
const slug=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40)||"informe";
const num=v=>{if(v===null||v===undefined||v==="")return null;if(typeof v==="number")return isFinite(v)?v:null;const m=String(v).replace(",",".").match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null};
const fmt=(n,d=1)=>n===null||n===undefined||!isFinite(n)?"—":Number(n).toLocaleString("es-CL",{maximumFractionDigits:d});
const fdate=s=>{if(!s)return"—";const[y,m,d]=String(s).slice(0,10).split("-");return`${d}-${m}-${y}`};
const split=s=>String(s||"").split(/,\s*/).map(x=>x.trim()).filter(Boolean);
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3500)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

// Fórmulas: las claves de campos se reemplazan por sus valores; solo aritmética
function evalFormula(f,vals){
  if(!f)return null;let missing=false;
  const expr=String(f).replace(/[a-z_][a-z0-9_]*/gi,k=>{const v=num(vals[k]);if(v===null){missing=true;return"0"}return"("+v+")"});
  if(missing||!/^[0-9+\-*/().\s]+$/.test(expr))return null;
  try{const r=Function('"use strict";return ('+expr+')')();return isFinite(r)?Math.round(r*1000)/1000:null}catch(e){return null}
}

// ---------- conexión con Google ----------
const apiUrl=()=>API||LS.get("apiUrl","");
async function apiGet(params){
  const u=new URL(apiUrl());Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u.toString(),{redirect:"follow"});if(!r.ok)throw new Error("http "+r.status);const j=await r.json();if(!j.ok)throw new Error(j.error||"error");return j;
}
async function apiPost(body){
  // Sin cabeceras: el navegador envía text/plain y Google lo acepta sin bloqueo CORS
  const r=await fetch(apiUrl(),{method:"POST",body:JSON.stringify(body),redirect:"follow"});
  if(!r.ok)throw new Error("http "+r.status);const j=await r.json();if(!j.ok)throw new Error(j.error||"error");return j;
}

// ---------- almacenamiento en el teléfono (sin señal) ----------
const IDB=(function(){
  let dbp=null;const mem=new Map();
  function open(){if(dbp)return dbp;dbp=new Promise(res=>{try{const r=indexedDB.open("bitacora-terreno",1);r.onupgradeneeded=()=>r.result.createObjectStore("outbox",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
  async function tx(mode,fn){const d=await open();if(!d)return undefined;return new Promise(res=>{try{const t=d.transaction("outbox",mode);const q=fn(t.objectStore("outbox"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
  return{
    async put(v){mem.set(v.id,v);await tx("readwrite",s=>s.put(v))},
    async del(id){mem.delete(id);await tx("readwrite",s=>s.delete(id))},
    async all(){const r=await tx("readonly",s=>s.getAll());if(Array.isArray(r))return r;return[...mem.values()]}
  };
})();

// ---------- estado ----------
const S={contracts:LS.get("config",[]),view:"registro",outbox:[],sent:LS.get("sent",[]),syncing:false,lastErr:null,configOk:false,
  draft:null,clave:LS.get("clave",""),report:{contractId:"",from:"",to:"",sec:{resumen:true,tipos:true,equipos:true,detalle:true,obs:true,fotos:false},data:null,photos:{}}};
const C=id=>S.contracts.find(c=>c.id===id);

function setSync(){
  const dot=$("#syncDot"),txt=$("#syncTxt");const n=S.outbox.length;
  if(!apiUrl()){dot.className="dot off";txt.textContent="Falta configurar";return}
  if(S.syncing){dot.className="dot";txt.textContent="Enviando…";return}
  if(!navigator.onLine){dot.className="dot off";txt.textContent=n?`Sin señal · ${n} por enviar`:"Sin señal · guarda en el teléfono";return}
  if(n){dot.className="dot";txt.textContent=`${n} por enviar`;return}
  dot.className="dot on";txt.textContent="Todo enviado";
}

// ---------- configuración desde la planilla ----------
async function loadConfig(){
  if(!apiUrl()||!navigator.onLine)return;
  try{const j=await apiGet({accion:"config"});S.contracts=j.contratos||[];S.configOk=true;LS.set("config",S.contracts);LS.set("configFecha",new Date().toISOString());
    const typing=document.activeElement&&$("#view").contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(!typing)render();
  }catch(e){if(!S.contracts.length)toast("No se pudo leer la configuración de la planilla.")}
}

// ================= REGISTRAR =================
function newDraft(c){return{id:uid(),contractId:c?c.id:"",fecha:today(),turno:"Día",supervisor:LS.get("supervisor",""),area:"",responsable:"",dotacion:"",equiposActivos:[],actividades:[newAct()],observaciones:"",detenciones:""}}
function newAct(){return{key:uid(),sector:"",tipo:"",descripcion:"",valores:{},equipos:[],fotoAntes:null,fotoDespues:null,open:true}}
function saveDraft(){if(S.draft){LS.set("draft:"+S.draft.contractId,S.draft);LS.set("lastContract",S.draft.contractId)}}
let draftT;function saveDraftSoon(){clearTimeout(draftT);draftT=setTimeout(saveDraft,400)}
function ensureDraft(){
  if(S.draft&&C(S.draft.contractId))return;
  const c=C(LS.get("lastContract",""))||S.contracts[0];if(!c){S.draft=null;return}
  const saved=LS.get("draft:"+c.id,null);S.draft=saved&&saved.contractId===c.id?saved:newDraft(c);
}
function equipChips(c,selected,scope,filterTo){
  return(c.equipos||[]).map(g=>{
    const items=(g.items||[]).filter(it=>!filterTo||!filterTo.length||filterTo.includes(it));if(!items.length)return"";
    return`<div class="grp"><div class="grp-t">${esc(g.grupo)}</div><div class="chips">${items.map(it=>`<button type="button" class="chip" data-eq="${esc(it)}" data-scope="${scope}" aria-pressed="${selected.includes(it)}">${esc(it)}</button>`).join("")}</div></div>`}).join("")||`<p class="note">Este contrato no tiene equipos en la planilla.</p>`;
}
function fieldInput(f,val,k){
  const id=`v_${k}_${f.key}`;const lab=`${esc(f.label)}${f.unidad?` <small>(${esc(f.unidad)})</small>`:""}`;
  if(f.tipo==="calculo")return`<label class="f" for="${id}">${lab}<input id="${id}" readonly data-calc="${esc(f.key)}" value="${val===null||val===undefined?"—":esc(fmt(val,2))}"></label>`;
  if(f.tipo==="lista")return`<label class="f" for="${id}">${lab}<select id="${id}" data-act="${k}" data-k="${esc(f.key)}"><option value="">Seleccionar…</option>${(f.opciones||[]).map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
  const nm=f.tipo==="numero"?' inputmode="decimal"':"";
  return`<label class="f" for="${id}">${lab}<input id="${id}" type="text"${nm} data-act="${k}" data-k="${esc(f.key)}" value="${esc(val??"")}"></label>`;
}
const typeOf=(c,n)=>(c.actividades||[]).find(x=>x.nombre===n);
function computeAct(c,a){const t=typeOf(c,a.tipo);if(!t)return;const v={...a.valores};for(let i=0;i<3;i++)t.campos.forEach(f=>{if(f.tipo==="calculo")v[f.key]=evalFormula(f.formula,v)});t.campos.forEach(f=>{if(f.tipo==="calculo")a.valores[f.key]=v[f.key]})}

function renderSetup(){
  $("#view").innerHTML=`<section class="sec"><div class="sec-h"><h2>Conectar con tu planilla</h2></div>
  <p>Pega la URL de la Aplicación web de Google (termina en <span class="mono">/exec</span>). Para que los supervisores no tengan que hacer esto, pégala también en el archivo <span class="mono">index.html</span> (línea <span class="mono">const API</span>).</p>
  <label class="f" for="setUrl">URL de la Aplicación web<input id="setUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(LS.get("apiUrl",""))}"></label>
  <div class="row"><button class="btn pri" id="saveUrl">Probar y guardar</button></div></section>`;
}
function renderRegistro(){
  const v=$("#view");v.className="";
  if(!apiUrl())return renderSetup();

function compressImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1280;let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);let q=.72,out=cv.toDataURL("image/jpeg",q);while(out.length>400000&&q>.35){q-=.08;out=cv.toDataURL("image/jpeg",q)}res(out)};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

// ---------- envío ----------
async function refreshOutbox(){S.outbox=(await IDB.all()).sort((a,b)=>a.queued<b.queued?-1:1);setSync()}
async function sync(){
  if(S.syncing||!apiUrl()||!navigator.onLine)return setSync();
  await refreshOutbox();if(!S.outbox.length)return setSync();
  S.syncing=true;setSync();
  for(const item of [...S.outbox]){
    try{
      for(const p of item.photos){if(!p.url){const r=await apiPost({accion:"foto",id:p.id,turno_id:item.id,data:p.data});p.url=r.url;await IDB.put(item)}}
      item.photos.forEach(p=>{item.actividades[p.act][p.campo]=p.url});
      const r=await apiPost({accion:"turno",turno:item.turno,actividades:item.actividades});
      await IDB.del(item.id);S.lastErr=null;
      S.sent.unshift({id:item.id,fecha:item.turno.fecha,contrato:item.turno.contrato,area:item.turno.area,turno:item.turno.turno,n:item.actividades.length,recibido:r.recibido||""});S.sent=S.sent.slice(0,60);LS.set("sent",S.sent);
    }catch(e){S.lastErr=String(e&&e.message||e);break}
  }
  S.syncing=false;await refreshOutbox();if(S.view==="envios")render();
}
addEventListener("online",()=>{sync();loadConfig()});addEventListener("offline",setSync);
setInterval(()=>{if(S.outbox.length)sync()},30000);

function aggregate(reps,c){

    r.actividades.forEach(a=>{acts++;const t=tipos[a.tipo]=tipos[a.tipo]||{n:0,sums:{}};t.n++;

      a.equipos.forEach(e=>{eq[e]=eq[e]||{dias:new Set(),acts:0};eq[e].acts++;eq[e].dias.add(r.fecha)})})});

  if(s.equipos){const rows=eqRows(D);h+=`<h3>Uso de equipos</h3>${rows.length?`<div class="tbl"><table><thead><tr><th>Equipo</th><th>Grupo</th><th class="n">Días en faena</th><th class="n">Actividades</th><th class="n">% de días</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${esc(r[0])}</td><td>${esc(r[1])}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td><td class="n">${r[4]}%</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">Sin equipos registrados.</p>`}`}
  if(s.detalle)h+=`<h3>Detalle por jornada</h3><div class="tbl"><table><thead><tr><th>Fecha</th><th>Turno</th><th>Área</th><th>Sector</th><th>Actividad</th><th>Descripción</th><th>Valores</th><th>Equipos</th></tr></thead><tbody>${detailRows(D).map(r=>`<tr>${r.map((x,i)=>`<td${i===7?' class="mono"':""}>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(s.obs){const o=obsRows(D);h+=`<h3>Observaciones y detenciones</h3>${o.length?`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Supervisor</th><th>Detenciones</th><th>Observaciones</th></tr></thead><tbody>${o.map(r=>`<tr><td>${fdate(r.fecha)}</td><td>${esc(r.supervisor)}</td><td>${esc(r.detenciones)}</td><td>${esc(r.observaciones)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">Sin observaciones en el período.</p>`}`}
  if(s.fotos){const ph=photoList(D);h+=`<h3>Registro fotográfico</h3>${ph.length?`<div class="thumbs">${ph.map(p=>`<figure style="margin:0"><img src="${p.src}" alt="${esc(p.cap)}"><figcaption class="note" style="font-size:12px;max-width:120px">${esc(p.cap)}</figcaption></figure>`).join("")}</div>`:`<p class="note">Sin fotos en el período. Si marcaste esta sección después de generar, vuelve a presionar Generar vista previa.</p>`}`}
  return h+`<p class="note">Generado el ${D.generado.toLocaleString("es-CL")} · Fuente: Bitácora de Terreno</p>`;
}

// ---------- descargas (PDF y Excel) ----------
const libs={};
function loadScript(src){if(libs[src])return libs[src];libs[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete libs[src];rej(new Error("carga"))};document.head.appendChild(s)});return libs[src]}
function download(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Descargado: "+name)}
const fileBase=()=>slug(S.report.data.c?.nombre)+"_"+S.report.from+"_a_"+S.report.to;
async function exportPdf(){
  const R=S.report,D=R.data;if(!D)return;
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js")}catch(e){toast("No se pudo preparar el PDF. Revisa la señal.");return}
  const doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"});const c=D.c||{};const W=doc.internal.pageSize.getWidth();const teal=[14,79,82];
  doc.setFillColor(...teal);doc.rect(0,0,W,24,"F");doc.setFillColor(242,183,5);doc.rect(0,24,W,1.6,"F");
  doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("Informe operacional · "+(c.nombre||""),12,11);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text([c.mandante?"Mandante: "+c.mandante:"",c.codigo?"Contrato "+c.codigo:"",c.administrador?"Administrador: "+c.administrador:"",`Período ${fdate(R.from)} al ${fdate(R.to)}`].filter(Boolean).join("   ·   "),12,18);
  doc.setTextColor(22,32,28);let y=34;
  const head=t=>{if(y>180){doc.addPage();y=16}doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(t,12,y);y+=3};
  const tbl=(h,b,o={})=>{doc.autoTable({startY:y,head:[h],body:b,theme:"grid",styles:{fontSize:8.5,cellPadding:1.8,lineColor:[203,211,207]},headStyles:{fillColor:teal,textColor:255},margin:{left:12,right:12},...o});y=doc.lastAutoTable.finalY+8};
  if(!D.reps.length){doc.setFontSize(11);doc.text("No hay registros en este período.",12,y)}else{
    if(R.sec.resumen){head("Resumen");tbl(["Informes de turno","Días con registro","Actividades","Dotación promedio","Equipos utilizados"],[[D.reps.length,D.dias,D.acts,fmt(D.dotProm),Object.keys(D.eq).length]])}
    if(R.sec.tipos){head("Totales por tipo de actividad");tbl(["Actividad","N°","Indicador","Total"],sumRows(D).map(r=>[r[0],r[1],r[2],typeof r[3]==="number"?fmt(r[3],2):r[3]]),{columnStyles:{1:{halign:"right"},3:{halign:"right"}}})}
    if(R.sec.equipos){const rows=eqRows(D);if(rows.length){head("Uso de equipos");tbl(["Equipo","Grupo","Días en faena","Actividades","% de días"],rows.map(r=>[r[0],r[1],r[2],r[3],r[4]+"%"]),{columnStyles:{2:{halign:"right"},3:{halign:"right"},4:{halign:"right"}}})}}
    if(R.sec.detalle){head("Detalle por jornada");tbl(["Fecha","Turno","Área","Sector","Actividad","Descripción","Valores","Equipos"],detailRows(D),{columnStyles:{5:{cellWidth:55},6:{cellWidth:60}}})}
    if(R.sec.obs){const o=obsRows(D);if(o.length){head("Observaciones y detenciones");tbl(["Fecha","Supervisor","Detenciones","Observaciones"],o.map(r=>[fdate(r.fecha),r.supervisor,r.detenciones||"",r.observaciones||""]))}}
    if(R.sec.fotos){const ph=photoList(D);if(ph.length){doc.addPage();y=16;head("Registro fotográfico");y+=2;let x=12;const w=64,h=48;
      ph.forEach(p=>{if(x+w>W-12){x=12;y+=h+10}if(y+h>200){doc.addPage();y=16;x=12}try{doc.addImage(p.src,"JPEG",x,y,w,h)}catch(e){}doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.text(p.cap,x,y+h+4);x+=w+6})}}
  }
  const n=doc.internal.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(86,99,93);doc.text(`Generado ${D.generado.toLocaleString("es-CL")} · Página ${i} de ${n}`,12,203)}
  download(fileBase()+".pdf",doc.output("blob"));
}
async function exportXls(){
  const R=S.report,D=R.data;if(!D)return;
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js")}catch(e){toast("No se pudo preparar el Excel. Revisa la señal.");return}
  const X=window.XLSX,wb=X.utils.book_new(),c=D.c||{};
  const add=(n,aoa,cols)=>{const ws=X.utils.aoa_to_sheet(aoa);if(cols)ws["!cols"]=cols.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,n)};
  add("Resumen",[["Informe operacional",c.nombre||""],["Mandante",c.mandante||""],["Contrato",c.codigo||""],["Administrador",c.administrador||""],["Desde",R.from],["Hasta",R.to],[],["Informes de turno",D.reps.length],["Días con registro",D.dias],["Actividades",D.acts],["Dotación promedio",D.dotProm===null?"":Math.round(D.dotProm*10)/10],["Equipos utilizados",Object.keys(D.eq).length]],[24,40]);
  add("Totales",[["Actividad","N°","Indicador","Total"],...sumRows(D)],[28,8,30,14]);
  const allF=[];(c.actividades||[]).forEach(t=>t.campos.forEach(f=>{if(!allF.find(x=>x.key===f.key))allF.push(f)}));
  const rows=[["Fecha","Turno","Supervisor","Área","Sector","Actividad","Descripción","Equipos",...allF.map(f=>f.label+(f.unidad?` (${f.unidad})`:""))]];
  D.reps.forEach(r=>r.actividades.forEach(a=>rows.push([r.fecha,r.turno||"",r.supervisor||"",r.area||"",a.sector||"",a.tipo||"",a.descripcion||"",a.equipos.join(", "),...allF.map(f=>{const v=a.valores[f.key];if(v===null||v===undefined)return"";return f.tipo==="lista"||f.tipo==="texto"?v:(num(v)??v)})])));
  add("Actividades",rows,[11,8,18,12,12,20,40,24,...allF.map(()=>14)]);
  add("Equipos",[["Equipo","Grupo","Días en faena","Actividades","% de días"],...eqRows(D)],[16,14,14,12,10]);
  add("Turnos",[["Fecha","Turno","Supervisor","Área","APR/Responsable","Dotación","Equipos activos","Detenciones","Observaciones","Guardado en terreno","Recibido en planilla","Enviado el mismo día"],
    ...D.reps.map(r=>[r.fecha,r.turno||"",r.supervisor||"",r.area||"",r.responsable||"",r.dotacion??"",r.equiposActivos.join(", "),r.detenciones||"",r.observaciones||"",r.creado||"",r.enviado||"",r.enviado?(String(r.enviado).slice(0,10)===r.fecha?"Sí":"No"):""])],[11,8,18,12,18,9,30,40,40,17,17,10]);
  download(fileBase()+".xlsx",new Blob([X.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}

// ================= render y eventos =================
function render(){
  $('#tabs [data-v="informe"]').hidden=!S.clave&&S.view!=="informe";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===S.view));
  ({registro:renderRegistro,envios:renderEnvios,informe:renderInforme}[S.view]||renderRegistro)();setSync();
}
function go(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}render();scrollTo(0,0)}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b)go(b.dataset.v)});
$("#adminLink").addEventListener("click",()=>go("informe"));
const view=$("#view");
view.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;const d=S.draft;
  if(t.dataset.eq!==undefined){const sc=t.dataset.scope,eq=t.dataset.eq;const arr=sc==="turno"?d.equiposActivos:d.actividades.find(a=>a.key===sc).equipos;const i=arr.indexOf(eq);i>=0?arr.splice(i,1):arr.push(eq);t.setAttribute("aria-pressed",i<0);
    if(sc==="turno"){d.actividades.forEach(a=>a.equipos=a.equipos.filter(x=>!d.equiposActivos.length||d.equiposActivos.includes(x)));saveDraft();render()}else saveDraftSoon();return}
  switch(t.id){
    case"saveUrl":{const u=$("#setUrl").value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)){toast("La URL debe empezar con https://script.google.com/macros/s/ y terminar en /exec");return}
      LS.set("apiUrl",u);try{await apiGet({accion:"ping"});toast("Conectado con la planilla");await loadConfig();render()}catch(err){toast("No responde. Revisa que la implementación tenga acceso: Cualquier persona.")}return}
    case"addAct":d.actividades.forEach(a=>a.open=false);d.actividades.push(newAct());saveDraft();render();return;
    case"submitRep":t.disabled=true;await submitReport();return;
    case"resetDraft":$("#resetConfirm").hidden=false;return;
    case"rcNo":$("#resetConfirm").hidden=true;return;
    case"rcYes":S.draft=newDraft(C(d.contractId));saveDraft();render();toast("Formulario limpio");return;
    case"syncNow":sync();return;
    case"saveClave":{const k=$("#i_clave").value.trim();if(!k)return;S.clave=k;LS.set("clave",k);render();return}
    case"logout":S.clave="";LS.del("clave");S.report.data=null;go("registro");return;
    case"genRep":loadReport();return;
    case"expPdf":t.disabled=true;await exportPdf();t.disabled=false;return;
    case"expXls":t.disabled=true;await exportXls();t.disabled=false;return;
  }
  if(t.dataset.toggle){const a=d.actividades.find(x=>x.key===t.dataset.toggle);a.open=!a.open;saveDraft();render();return}
  if(t.dataset.delact){d.actividades=d.actividades.filter(x=>x.key!==t.dataset.delact);saveDraft();render()}
});
view.addEventListener("keydown",e=>{const b=e.target.closest(".ph .box");if(b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();b.parentElement.querySelector("input").click()}});
view.addEventListener("input",e=>{
  const el=e.target,d=S.draft;
  if(S.view==="registro"&&d){
    if(el.dataset.h){d[el.dataset.h]=el.value;saveDraftSoon();return}
    if(el.dataset.act&&el.dataset.k){const a=d.actividades.find(x=>x.key===el.dataset.act);a.valores[el.dataset.k]=el.value;computeAct(C(d.contractId),a);
      document.querySelectorAll(`.act[data-key="${a.key}"] [data-calc]`).forEach(i=>{const v=a.valores[i.dataset.calc];i.value=v===null||v===undefined?"—":fmt(v,2)});saveDraftSoon();return}
    if(el.dataset.a==="descripcion"){d.actividades.find(x=>x.key===el.dataset.act).descripcion=el.value;saveDraftSoon()}
  }
  if(S.view==="informe"){if(el.id==="i_from")S.report.from=el.value;if(el.id==="i_to")S.report.to=el.value}
});
view.addEventListener("change",async e=>{
  const el=e.target,d=S.draft;
  if(S.view==="registro"&&d){
    if(el.id==="r_contract"){saveDraft();const c=C(el.value);S.draft=LS.get("draft:"+c.id,null)||newDraft(c);LS.set("lastContract",c.id);render();return}
    if(el.dataset.a&&el.tagName==="SELECT"){const a=d.actividades.find(x=>x.key===el.dataset.act);a[el.dataset.a]=el.value;if(el.dataset.a==="tipo")a.valores={};saveDraft();render();return}
    if(el.dataset.photo){const f=el.files&&el.files[0];if(!f)return;try{d.actividades.find(x=>x.key===el.dataset.act)[el.dataset.photo]=await compressImage(f);saveDraft();render()}catch(err){toast("No se pudo leer la imagen.")}}
  }
  if(S.view==="informe"){const R=S.report;if(el.id==="i_c"){R.contractId=el.value;R.data=null;render()}if(el.dataset.sec){R.sec[el.dataset.sec]=el.checked;if(R.data)$("#repOut").innerHTML=reportHTML()}}
});

// ---------- arranque ----------
const h=(location.hash||"").slice(1);if(["registro","envios","informe"].includes(h))S.view=h;
addEventListener("hashchange",()=>{const v=(location.hash||"").slice(1);if(["registro","envios","informe"].includes(v)&&v!==S.view){S.view=v;render()}});
render();refreshOutbox().then(sync);loadConfig();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
